version: 1
id: cute4tops_shuttle512_memorymap_demo
isa_profile: rv64_saturn512
memory_map: shuttle_memorymap_demo
cute:
  config: CUTE_4Tops_64SCP
  instances:
  - 0
  isa:
    version: cute_isa_v1
soc:
  core:
    kind: shuttle
    count: 1
    shuttle_tile_beat_bytes: 64
  bus:
    system_bits: 512
    memory_bits: 512
  cache:
    inclusive_kb: 512
    outer_latency_cycles: 40
    banks: 4
    cache_hash: true
    tl_monitors: false
  vector:
    version: saturn_rvv
    vLen: 512
    dLen: 512
    mLen: 512
capability:
  tensor_ops:
  - matmul
  - conv
  layer_ops: []
  fused_ops: []
trace_capability:
  structured_trace: true
  d_store_data: true
  mem_req_rsp: true
  perf_counter_snapshot: true
